{% extends "seminar/base.html" %}
{% block content %}
    <h1>
        {% if form.instance.pk %}
            Edit Book
        {% else %}
            Add Book
        {% endif %}
    </h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{% url 'book_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock content %}
